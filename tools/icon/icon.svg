<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- CELLOG: a selected spreadsheet cell (fill handle bottom-right), a
       silver trophy locked inside it behind bars in the game's colours. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16213a"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa6bb"/><stop offset=".45" stop-color="#f4f7fb"/><stop offset="1" stop-color="#8793a9"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g stroke="#1f2b44" stroke-width="3">
    <path d="M64 0V512M128 0V512M192 0V512M256 0V512M320 0V512M384 0V512M448 0V512M0 64H512M0 128H512M0 192H512M0 256H512M0 320H512M0 384H512M0 448H512"/>
  </g>
  <g id="art">
    <rect x="96" y="128" width="320" height="256" rx="6" fill="rgba(52,208,160,.12)" stroke="#34d0a0" stroke-width="18" filter="url(#glow)"/>
    <g fill="url(#silver)">
      <path d="M186 168h140v54a70 70 0 0 1-140 0z"/>
      <path d="M186 182h-34a34 40 0 0 0 46 56M326 182h34a34 40 0 0 1-46 56" fill="none" stroke="#c9d1de" stroke-width="16"/>
      <rect x="242" y="286" width="28" height="34"/>
      <rect x="206" y="318" width="100" height="26" rx="6"/>
    </g>
    <rect x="146" y="100" width="30" height="312" rx="15" fill="#ff6b6b"/>
    <rect x="214" y="100" width="30" height="312" rx="15" fill="#ffcc4d"/>
    <rect x="282" y="100" width="30" height="312" rx="15" fill="#4ea1ff"/>
    <rect x="350" y="100" width="30" height="312" rx="15" fill="#b892ff"/>
    <rect x="392" y="360" width="48" height="48" rx="4" fill="#34d0a0" stroke="#0b1220" stroke-width="10"/>
  </g>
</svg>
